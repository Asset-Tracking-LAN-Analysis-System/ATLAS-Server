[project]
name = "atlas-server"
version = "0.0.2"
description = "ATLAS-server"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic>=2.13.4",
    "uvicorn>=0.47.0",
    "vshc>=0.1.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.15.13",
    "mypy>=2.1.0",
    "build>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
server = "server.__main__:main"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
